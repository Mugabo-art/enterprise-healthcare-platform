openapi: 3.0.3
info:
  title: Enterprise Healthcare Platform API
  version: "1.0.0"
  description: >
    API for the Enterprise Healthcare Platform. This spec currently documents
    the implemented Auth and Patient modules in full; remaining modules are
    described at a summary level in API_DOCUMENTATION.md pending implementation.
servers:
  - url: http://localhost:8080/api
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      summary: Self-register a PATIENT account (any other role requires an authenticated ADMIN, else 403)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Email already registered
  /auth/login:
    post:
      summary: Authenticate and receive tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '202':
          description: MFA challenge required
        '401':
          description: Invalid credentials
  /auth/refresh:
    post:
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid or expired refresh token
  /patients:
    get:
      summary: List patients
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: size
          schema:
            type: integer
      responses:
        '200':
          description: Paginated patient list
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/Patient'
                  page:
                    type: integer
                  totalElements:
                    type: integer
    post:
      summary: Create a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreateRequest'
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
  /patients/{id}:
    get:
      summary: Get a patient by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Patient record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Not found
  /patients/{patientId}/lab-requests:
    get:
      summary: List a patient's lab requests, newest first
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '200':
          description: Lab request list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabRequest'
  /patients/{patientId}/visits/{visitId}/lab-requests:
    post:
      summary: Request a lab test for a patient's visit (ADMIN, NURSE, DOCTOR)
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - in: path
          name: visitId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabRequestCreateRequest'
      responses:
        '201':
          description: Lab request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabRequest'
  /patients/{patientId}/lab-requests/{labRequestId}/status:
    put:
      summary: Update a lab request's workflow status (ADMIN, LAB_TECH)
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - in: path
          name: labRequestId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [REQUESTED, IN_PROGRESS, COMPLETED, CANCELLED]
      responses:
        '200':
          description: Updated lab request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabRequest'
        '409':
          description: Request already completed
  /patients/{patientId}/lab-requests/{labRequestId}/result:
    post:
      summary: Record a result against a lab request (ADMIN, LAB_TECH)
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - in: path
          name: labRequestId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resultData]
              properties:
                resultData:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Result recorded, request marked COMPLETED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabResult'
        '409':
          description: A result already exists for this request
    get:
      summary: Get the result recorded for a lab request
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - in: path
          name: labRequestId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lab result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabResult'
        '404':
          description: No result recorded yet
  /medications:
    get:
      summary: List medication inventory (ADMIN, PHARMACIST, DOCTOR)
      parameters:
        - in: query
          name: lowStock
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Medications ordered by name
    post:
      summary: Add a medication (ADMIN, PHARMACIST)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, unit, stockQuantity, reorderThreshold]
              properties:
                name: { type: string }
                unit: { type: string }
                stockQuantity: { type: integer, minimum: 0 }
                reorderThreshold: { type: integer, minimum: 0 }
      responses:
        '201':
          description: Created
        '409':
          description: Name already exists
  /medications/{id}:
    put:
      summary: Update unit, reorder threshold or active flag (ADMIN, PHARMACIST)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated
  /medications/{id}/restock:
    post:
      summary: Add received stock (ADMIN, PHARMACIST)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Restocked
  /pharmacy/prescriptions:
    get:
      summary: Active prescriptions awaiting dispensing, oldest first (ADMIN, PHARMACIST)
      responses:
        '200':
          description: Work queue
  /prescriptions/{prescriptionId}/dispense:
    post:
      summary: Dispense a prescription; decrements stock and completes it (ADMIN, PHARMACIST)
      parameters:
        - in: path
          name: prescriptionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [medicationId, quantity]
              properties:
                medicationId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Dispensed
        '409':
          description: Prescription not active, medication inactive, or insufficient stock
  /patients/{patientId}/dispensations:
    get:
      summary: A patient's dispensing history, newest first
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '200':
          description: Dispensations

components:
  parameters:
    PatientId:
      in: path
      name: patientId
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          type: string
          enum: [ADMIN, DOCTOR, NURSE, LAB_TECH, PHARMACIST, BILLING_CLERK]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
    PatientCreateRequest:
      type: object
      required: [firstName, lastName, dateOfBirth, sex]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        sex:
          type: string
          enum: [MALE, FEMALE, OTHER]
        contactPhone:
          type: string
        contactEmail:
          type: string
    Patient:
      allOf:
        - $ref: '#/components/schemas/PatientCreateRequest'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
    LabRequestCreateRequest:
      type: object
      required: [testType]
      properties:
        testType:
          type: string
        notes:
          type: string
    LabRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
        requestedById:
          type: string
          format: uuid
        testType:
          type: string
        status:
          type: string
          enum: [REQUESTED, IN_PROGRESS, COMPLETED, CANCELLED]
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
    LabResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        labRequestId:
          type: string
          format: uuid
        recordedById:
          type: string
          format: uuid
        resultData:
          type: object
          additionalProperties: true
        recordedAt:
          type: string
          format: date-time

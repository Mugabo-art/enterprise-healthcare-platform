# Production profile (SPRING_PROFILES_ACTIVE=prod). There are deliberately NO fallback defaults for
# secrets: a missing DB_PASSWORD / JWT_SECRET / CORS_ALLOWED_ORIGINS fails startup instead of silently
# running with a publicly-known value. ProductionConfigValidator additionally rejects weak values.
spring:
  datasource:
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
    # Local-only seed versions (db/dev) may exist in the history of a DB that was once used for dev.
    ignore-migration-patterns: "*:missing"

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
  forward-headers-strategy: framework # honour X-Forwarded-* from the ingress (client IP, https scheme for HSTS)
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  server:
    port: ${MANAGEMENT_PORT:8081} # actuator (incl. /prometheus) is NOT reachable through the public port / ingress

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

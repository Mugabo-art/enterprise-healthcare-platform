name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (but never a deploy that is mid-flight on main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Trivy runs from a pinned official image rather than a third-party action.
  TRIVY_IMAGE: aquasec/trivy:0.58.0

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Docker is available on the runner, so the Testcontainers migration test (real PostgreSQL 16)
      # runs here even though it is skipped on machines without Docker.
      - name: Build and test
        working-directory: backend
        run: mvn -B verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      # Only runtime dependencies gate the build; dev-tool advisories are reported by Dependabot.
      - name: Audit runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  security-scan:
    name: Dependency, secret & config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Filesystem scan: vulnerable dependencies (pom.xml, package-lock.json), committed secrets,
      # and misconfiguration in Dockerfiles / Kubernetes manifests.
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" fs . \
            --scanners vuln,secret,misconfig --severity CRITICAL,HIGH --ignore-unfixed \
            --skip-dirs frontend/node_modules,backend/target --exit-code 1

  docker-images:
    name: Build, scan & push images
    needs: [backend, frontend, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image repository
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Images are tagged with the commit SHA only — an immutable reference — and are scanned BEFORE
      # they are pushed, so a vulnerable image never reaches the registry.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ghcr.io/${{ env.IMAGE_REPO }}/backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ghcr.io/${{ env.IMAGE_REPO }}/frontend:${{ github.sha }}

      - name: Scan images
        run: |
          for svc in backend frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 \
              "ghcr.io/${IMAGE_REPO}/${svc}:${GITHUB_SHA}"
          done

      - name: Push images
        run: |
          docker push ghcr.io/${IMAGE_REPO}/backend:${GITHUB_SHA}
          docker push ghcr.io/${IMAGE_REPO}/frontend:${GITHUB_SHA}

  release-manifests:
    name: Pin manifests to this build (GitOps)
    needs: docker-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ArgoCD watches /k8s and reconciles the cluster, so "deploying" is committing the new image
      # tag. No cluster credentials ever live in CI. See docs/DEPLOYMENT_GUIDE.md.
      # (If main is branch-protected, allow github-actions[bot] to push, or turn this into a PR.)
      - name: Set image tag to ${{ github.sha }}
        run: |
          sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" k8s/kustomization.yaml
          if git diff --quiet; then echo "manifests already pinned"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): pin images to ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

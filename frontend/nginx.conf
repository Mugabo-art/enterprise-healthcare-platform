server {
    listen 8080; # unprivileged image: cannot bind :80, runs as a non-root user
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers. (Kept at server level only: nginx drops inherited add_header directives in
    # any location block that declares its own.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Google Fonts is the only third-party origin (see index.html); inline styles are used by the React components.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hashed build assets are immutable and safe to cache for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback — client-side routing handles the rest. index.html must never be cached so a
    # new deploy is picked up immediately.
    location / {
        expires -1;
        try_files $uri /index.html;
    }

    # Reverse-proxied to the backend service name in Docker Compose (Kubernetes routes /api at the ingress)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }
}

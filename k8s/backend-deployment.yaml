apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: healthcare-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: ghcr.io/Mugabo-art/enterprise-healthcare-platform/backend:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - secretRef: { name: healthcare-db-secret }
            - secretRef: { name: healthcare-app-secret }
          env:
            - name: DB_HOST
              value: postgres
            - name: REDIS_HOST
              value: redis
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: healthcare-platform
spec:
  selector: { app: backend }
  ports: [{ port: 8080, targetPort: 8080 }]

# Horizontal scaling + disruption budgets. Requires metrics-server for the HPAs.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: healthcare-platform
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # avoid flapping after a traffic spike
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: healthcare-platform
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: frontend }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
# Node drains / cluster upgrades may never take the last healthy replica down.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: healthcare-platform
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: backend }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: healthcare-platform
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: frontend }

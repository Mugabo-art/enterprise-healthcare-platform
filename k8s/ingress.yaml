apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcare-platform
  namespace: healthcare-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # ingress-nginx: force HTTPS, cap request size (attachments are limited to 10MB by the backend),
    # and add a coarse per-client rate limit in front of the application-level limiter.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 11m
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["healthcare.example.com"]
      secretName: healthcare-tls
  rules:
    - host: healthcare.example.com
      http:
        paths:
          # Only /api reaches the backend; /actuator and /swagger-ui are deliberately not routed.
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }

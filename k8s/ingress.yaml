apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcare-platform
  namespace: healthcare-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: ["healthcare.example.com"]
      secretName: healthcare-tls
  rules:
    - host: healthcare.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
